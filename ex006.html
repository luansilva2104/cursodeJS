<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        document.writeln("<br>*******************  TESTANDO CONDICIONAIS E OPERADORES LÓGICOS </br>");

var eu = {
  idade: parseInt(window.prompt("Digite sua idade:")),
  cadastro: window.prompt("Você tem cadastro no site? (sim/não)").toLowerCase(),
  luan: window.prompt("Você é o Luan? (sim/não)").toLowerCase()
};


if (eu.luan == "sim") {
    document.writeln("<br>Você não é maior de idade, mas pode trabalhar com o Silvio.</br>");
}else if (eu.idade < 18 && eu.luan == "não") { 
    document.writeln("<br>Você é menor de idade.</br>");
}else if (eu.idade > 18 && eu.luan == "não") { 
    document.writeln("<br>Você é maior de idade.</br>");
}

if (eu.luan == "sim") {
    document.writeln("<br>Você pode trabalhar com o Silvio, dale Luan!!</br>");
} 
 else if (eu.idade <= 18 || eu.idade > 18 && eu.cadastro == "sim" || eu.cadastro == "não" && eu.luan == "não") {
    document.writeln("<br>Você não pode trabalhar com o Silvio.</br>");
}


    </script>
    
</body> 
</html>
