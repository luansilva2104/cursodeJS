<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            background-color: #f1f1f1;
            font : normal 16px Arial;
            color: #333;
        } 
     </style>
</head>
<body>
    <h1>Iniciando estudos DOM</h1>
    <p>Aqui vai o resultado</p>
    <p> Aprendendo a usar <strong> DOM</strong> em Java Script</p>
    <div id="teste">Clique em mim</div>
    <script>
        //DOM - Document Object Model - Modelo de Objeto de Documento

        var corpo = window.document.body; //pega o corpo do documento
        corpo.style.backgroundColor = "lightgray"; //muda a cor do fundo do corpo do documento

        var p1 = window.document.getElementsByTagName('p')[0]; //pega o primeiro elemento p do documento pelo número do índice
        document.write("Está escrito assim: " + p1.innerHTML); //escreve na tela o texto do elemento p
        p1.style.color = 'red'; //muda a cor do texto do elemento p

        var d = window.document.getElementById('teste'); //pegs o elemento com id "teste"
        d.innerHTML = "Cliquei no elemento"; //muda o texto do elemento



    </script>
</body>
</html>
